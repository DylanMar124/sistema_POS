{% extends 'base.html' %}

{% block content %}
<h1 class="text-2xl font-headline font-bold mb-4">Nueva Venta</h1>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Columna izquierda: búsqueda y carrito -->
    <div class="lg:col-span-2 bg-white rounded-lg shadow p-4">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Código de barras / búsqueda rápida</label>
            <div class="flex gap-2">
                <input type="text" id="codigo-input" placeholder="Escanea o escribe código/nombre" 
                    class="flex-1 border border-gray-300 rounded-md py-2 px-3">
                <button id="buscar-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Agregar
                </button>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Seleccionar producto del catálogo</label>
            <div class="flex gap-2">
                <input type="text" id="select-producto" list="productos-lista" 
                    placeholder="Escribe o selecciona un producto"
                    class="flex-1 border border-gray-300 rounded-md py-2 px-3">
                <datalist id="productos-lista">
                    {% for p in productos %}
                    <option value="{{ p.id }}|{{ p.nombre }}" data-precio="{{ p.precio }}" data-stock="{{ p.cantidad }}">
                        {{ p.nombre }} - ${{ p.precio }} (stock: {{ p.cantidad }})
                    </option>
                    {% endfor %}
                </datalist>
                <button id="agregar-select-btn" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                    Agregar
                </button>
            </div>
        </div>

        <h2 class="text-lg font-semibold mb-2">Carrito de compra</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border">
                <thead>
                    <tr><th class="py-2 px-3 border-b">Producto</th><th class="py-2 px-3 border-b">Cantidad</th><th class="py-2 px-3 border-b">Precio</th><th class="py-2 px-3 border-b">Subtotal</th><th class="py-2 px-3 border-b"></th></tr>
                </thead>
                <tbody id="carrito-body"></tbody>
                <tfoot>
                    <tr class="font-bold">
                        <td colspan="3" class="text-right py-2 px-3">Total:</td>
                        <td id="total-carrito" class="py-2 px-3">$0.00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <!-- Columna derecha: pagos y finalizar -->
    <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-2">Pagos</h2>
        <div id="pagos-list" class="space-y-2 mb-3">
            <div class="flex gap-2">
                <input type="number" id="monto-pago" step="0.01" placeholder="Monto" class="w-1/2 border rounded py-1 px-2">
                <select id="metodo-pago" class="w-1/2 border rounded py-1 px-2">
                    <option value="efectivo">Efectivo</option>
                    <option value="tarjeta">Tarjeta</option>
                    <option value="otro">Otro</option>
                </select>
                <button id="agregar-pago-btn" class="bg-green-500 text-white px-2 rounded">+</button>
            </div>
        </div>
        <div id="pagos-registrados" class="text-sm mb-4"></div>
        <div class="border-t pt-2 mb-4">
            <span class="font-bold">Total pagado: </span><span id="total-pagado">$0.00</span>
            <span class="ml-4 font-bold">Faltante: </span><span id="faltante">$0.00</span>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Observaciones</label>
            <textarea id="observaciones" rows="2" class="w-full border rounded py-1 px-2"></textarea>
        </div>
        <button id="finalizar-btn" class="w-full bg-green-600 hover:bg-green-800 text-white font-bold py-2 rounded">
            Finalizar Venta
        </button>
    </div>
</div>

<script>
    let carrito = [];  // {id, nombre, cantidad, precio_unitario}
    let pagos = [];    // {monto, metodo}

    function actualizarCarrito() {
        const tbody = document.getElementById('carrito-body');
        tbody.innerHTML = '';
        let total = 0;
        carrito.forEach((item, idx) => {
            const subtotal = item.cantidad * item.precio_unitario;
            total += subtotal;
            const row = tbody.insertRow();
            row.insertCell(0).innerText = item.nombre;
            row.insertCell(1).innerHTML = `<input type="number" min="0.01" step="any" value="${item.cantidad}" class="w-20 border rounded" data-index="${idx}" data-field="cantidad">`;
            row.insertCell(2).innerHTML = `<input type="number" step="0.01" value="${item.precio_unitario}" class="w-24 border rounded" data-index="${idx}" data-field="precio">`;
            row.insertCell(3).innerText = `$${subtotal.toFixed(2)}`;
            row.insertCell(4).innerHTML = `<button class="remover-item text-red-500" data-index="${idx}">X</button>`;
        });
        document.getElementById('total-carrito').innerText = `$${total.toFixed(2)}`;
        actualizarFaltante();
        // eventos a los inputs
        document.querySelectorAll('[data-field="cantidad"]').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const idx = e.target.dataset.index;
                carrito[idx].cantidad = parseFloat(e.target.value);
                actualizarCarrito();
            });
        });
        document.querySelectorAll('[data-field="precio"]').forEach(inp => {
            inp.addEventListener('change', (e) => {
                const idx = e.target.dataset.index;
                carrito[idx].precio_unitario = parseFloat(e.target.value);
                actualizarCarrito();
            });
        });
        document.querySelectorAll('.remover-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = e.target.dataset.index;
                carrito.splice(idx, 1);
                actualizarCarrito();
            });
        });
    }

    function actualizarFaltante() {
        const totalVenta = parseFloat(document.getElementById('total-carrito').innerText.replace('$', ''));
        const totalPagado = pagos.reduce((sum, p) => sum + p.monto, 0);
        document.getElementById('total-pagado').innerText = `$${totalPagado.toFixed(2)}`;
        const faltante = totalVenta - totalPagado;
        document.getElementById('faltante').innerText = `$${faltante.toFixed(2)}`;
        return { totalVenta, totalPagado, faltante };
    }

    function agregarProductoAlCarrito(producto) {
        const existe = carrito.find(p => p.id === producto.id);
        if (existe) {
            existe.cantidad += 1;
        } else {
            carrito.push({
                id: producto.id,
                nombre: producto.nombre,
                cantidad: 1,
                precio_unitario: producto.precio
            });
        }
        actualizarCarrito();
    }

    document.getElementById('buscar-btn').addEventListener('click', async () => {
        const codigo = document.getElementById('codigo-input').value.trim();
        if (!codigo) return;
        try {
            const resp = await fetch(`/ventas/buscar_producto?codigo=${encodeURIComponent(codigo)}`);
            if (!resp.ok) {
                const err = await resp.json();
                alert(err.error || 'Producto no encontrado');
                return;
            }
            const producto = await resp.json();
            if (producto.stock <= 0) {
                alert('Producto sin stock');
                return;
            }
            agregarProductoAlCarrito(producto);
            document.getElementById('codigo-input').value = '';
        } catch (error) {
            alert('Error al buscar producto');
        }
    });

    // Agregar pago
    document.getElementById('agregar-pago-btn').addEventListener('click', () => {
        const monto = parseFloat(document.getElementById('monto-pago').value);
        const metodo = document.getElementById('metodo-pago').value;
        if (isNaN(monto) || monto <= 0) {
            alert('Monto inválido');
            return;
        }
        pagos.push({ monto, metodo });
        document.getElementById('monto-pago').value = '';
        actualizarListaPagos();
        actualizarFaltante();
    });

    function actualizarListaPagos() {
        const container = document.getElementById('pagos-registrados');
        container.innerHTML = '';
        pagos.forEach((p, idx) => {
            const div = document.createElement('div');
            div.className = 'flex justify-between items-center text-sm';
            div.innerHTML = `<span>${p.metodo}: $${p.monto.toFixed(2)}</span>
                             <button data-idx="${idx}" class="eliminar-pago text-red-500">X</button>`;
            container.appendChild(div);
        });
        document.querySelectorAll('.eliminar-pago').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(e.target.dataset.idx);
                pagos.splice(idx, 1);
                actualizarListaPagos();
                actualizarFaltante();
            });
        });
    }

    document.getElementById('finalizar-btn').addEventListener('click', async () => {
        if (carrito.length === 0) {
            Swal.fire('Error', 'Agrega productos', 'error');
            return;
        }
        const { totalVenta, totalPagado, faltante } = actualizarFaltante();
        if (faltante > 0.01) {
            Swal.fire('Error', 'El total pagado es insuficiente', 'error');
            return;
        }

        const payload = {
            carrito: carrito,
            pagos: pagos,
            observaciones: document.getElementById('observaciones').value
        };

        try {
            const resp = await fetch('/ventas/nueva', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (data.success) {
                window.location.href = data.redirect;  // Redirige a lista_ventas, donde se mostrará el flash
            } else {
                Swal.fire('Error', data.error, 'error');
            }
        } catch (error) {
            Swal.fire('Error', 'Error de conexión', 'error');
        }
    });

    // Permitir presionar Enter en el campo de código
    document.getElementById('codigo-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('buscar-btn').click();
        }
    });

    function obtenerProductoDesdeDatalist(valor) {
        // valor viene como "id|nombre"
        const partes = valor.split('|');
        if (partes.length < 2) return null;
        const id = parseInt(partes[0]);
        const opcion = document.querySelector(`#productos-lista option[value="${valor}"]`);
        if (!opcion) return null;
        return {
            id: id,
            nombre: partes[1],
            precio: parseFloat(opcion.dataset.precio),
            stock: parseFloat(opcion.dataset.stock)
        };
    }

    document.getElementById('agregar-select-btn').addEventListener('click', () => {
        const inputSelect = document.getElementById('select-producto');
        const valor = inputSelect.value.trim();
        if (!valor) return;
        const producto = obtenerProductoDesdeDatalist(valor);
        if (!producto) {
            alert('Selecciona un producto válido de la lista');
            return;
        }
        if (producto.stock <= 0) {
            alert('Producto sin stock');
            return;
        }
        agregarProductoAlCarrito(producto);
        inputSelect.value = ''; // limpiar
    });
</script>
{% endblock %}
