{% extends 'base.html' %}

{% block content %}
<h1 class="text-2xl font-headline font-bold mb-4">Nueva Compra</h1>

<div class="bg-white rounded-lg shadow p-6">
    <form method="POST" id="formCompra">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Proveedor (opcional)</label>
                <input type="text" name="proveedor" class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Factura/Referencia (opcional)</label>
                <input type="text" name="factura" class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
            </div>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Observaciones (opcional)</label>
            <textarea name="observaciones" rows="2" class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></textarea>
        </div>

        <h2 class="text-lg font-semibold mt-6 mb-3">Productos</h2>
        <div id="detalles-container">
            <div class="detalle-fila grid grid-cols-1 md:grid-cols-6 gap-4 mb-3 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Código de barras</label>
                    <input type="text" name="codigo_barras[]" class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del producto *</label>
                    <input type="text" name="nombre_producto[]" required list="productos-lista" class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                    <datalist id="productos-lista">
                        {% for p in productos %}
                        <option value="{{ p.nombre }}"></option>
                        {% endfor %}
                    </datalist>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad *</label>
                    <input type="number" step="0.01" name="cantidad[]" required class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Precio unitario (costo) *</label>
                    <input type="number" step="0.01" name="precio_unitario[]" required class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Precio de venta (solo si nuevo)</label>
                    <input type="number" step="0.01" name="precio_venta[]" class="w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                </div>
                <div>
                    <button type="button" class="remover-fila bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Quitar</button>
                </div>
            </div>
        </div>
        <button type="button" id="agregar-fila" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded mb-4">+ Agregar otro producto</button>

        <div class="flex justify-end">
            <a href="{{ url_for('compras.lista_compras') }}" class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded mr-2">Cancelar</a>
            <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Guardar Compra</button>
        </div>
    </form>
</div>

<script>
    document.getElementById('agregar-fila').addEventListener('click', function() {
        const container = document.getElementById('detalles-container');
        const plantilla = container.children[0].cloneNode(true);
        // Limpiar valores
        plantilla.querySelectorAll('input, select').forEach(el => {
            if (el.tagName === 'SELECT') el.selectedIndex = 0;
            else el.value = '';
        });
        container.appendChild(plantilla);
    });

    document.getElementById('detalles-container').addEventListener('click', function(e) {
        if (e.target.classList.contains('remover-fila')) {
            const fila = e.target.closest('.detalle-fila');
            if (document.querySelectorAll('.detalle-fila').length > 1) {
                fila.remove();
            } else {
                alert('Debe haber al menos un producto');
            }
        }
    });
</script>
{% endblock %}
